server:
  port: 8081

logging:
  level:
    org.springframework.security: INFO
    org.flywaydb: INFO
    org.springframework.r2dbc: INFO
    org.springframework.transaction: INFO

spring:
  flyway:
    enabled: true
    locations:
      - classpath:db/migration/postgres
    table: resume_app_schema_history
    url: jdbc:postgresql://${APP_DB_HOST:localhost}:${APP_DB_PORT:5432}/${APP_DB_NAME:app_db}?sslMode=${APP_DB_SSLMODE:disable}
    user: ${APP_DB_USER:app_user}
    password: ${APP_DB_PASSWORD:app_pass}

  r2dbc:
    url: r2dbc:postgresql://${APP_DB_HOST:localhost}:${APP_DB_PORT:5432}/${APP_DB_NAME:app_db}?sslMode=${APP_DB_SSLMODE:disable}
    username: ${APP_DB_USER:app_user}
    password: ${APP_DB_PASSWORD:app_pass}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/aura}

resume:
  pdf:
    wkhtmltopdf-path: ${WKHTMLTOPDF_PATH:./scripts/wkhtmltopdf.sh}
    wkhtmltoimage-path: ${WKHTMLTOIMAGE_PATH:./scripts/wkhtmltoimage.sh} # PNG 내보내기 (같은 wkhtmltopdf 컨테이너)
    timeout-seconds: ${WKHTML_TIMEOUT_SECONDS:30}
    png-width: ${WKHTML_PNG_WIDTH:1024}

# AI 에이전트(ADK) 베이스 URL
aiAgent:
  base-url: ${AI_AGENT_BASE_URL:http://localhost:8000}

keycloak:
  # 프로필 조회/수정을 위임하는 Keycloak realm 베이스 URL (Account API = {realm-url}/account)
  realm-url: ${KEYCLOAK_REALM_URL:http://localhost:8080/realms/aura}
